name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 120

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 10

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        env:
          PIP_EXTRA_INDEX_URL: "https://aa:${{ secrets.AA_PYPI_PASSWORD }}@pypi.autoactuary.com/simple https://rsc:${{ secrets.RSC_PYPI_PASSWORD }}@pypi.refstudycentre.com/simple"
        run: |
          python -m pip install -c ci-constraints.txt -r test-requirements.txt .
        timeout-minutes: 10

      - name: Test
        run: |
          python -m unittest
        timeout-minutes: 60
