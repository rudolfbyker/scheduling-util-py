name: Lint with MyPy

on:
  push:
    branches: [ main ]
    paths:
      - '*.py'
      - '**/*.py'
  pull_request:
    branches: [ main ]
    paths:
      - '*.py'
      - '**/*.py'

jobs:
  mypy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install dependencies
        env:
          PIP_EXTRA_INDEX_URL: "https://aa:${{ secrets.AA_PYPI_PASSWORD }}@pypi.autoactuary.com/simple https://rsc:${{ secrets.RSC_PYPI_PASSWORD }}@pypi.refstudycentre.com/simple"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c ci-constraints.txt . -r mypy-requirements.txt -r test-requirements.txt

      - name: Run MyPy
        run: |
          mypy .
